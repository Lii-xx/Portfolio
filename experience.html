<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏经历 — Game Designer Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#0d0221;--bg-2:#1a0533;--surface:#170a3a;--surface-2:#1f0f4a;--border:#3d1d6e;
    --text:#f0eaff;--text-secondary:#9d8ec7;
    --green:#00ff41;--pink:#ff2e88;--cyan:#00f0ff;--yellow:#ffd23f;
    --radius:4px;--shadow-hard:4px 4px 0 #000;
    --glow-green:0 0 8px rgba(0,255,65,.6),0 0 16px rgba(0,255,65,.3);
    --glow-pink:0 0 8px rgba(255,46,136,.6),0 0 16px rgba(255,46,136,.3);
    --transition:.2s steps(4);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC','VT323',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;line-height:1.7;position:relative;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply;}
body::after{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%);}
.synth-grid{position:fixed;left:0;right:0;bottom:0;height:50vh;z-index:-2;background:linear-gradient(to bottom,transparent 0%,#0d0221 80%),repeating-linear-gradient(90deg,transparent 0,transparent 79px,var(--pink) 79px,var(--pink) 80px),repeating-linear-gradient(0deg,transparent 0,transparent 79px,var(--cyan) 79px,var(--cyan) 80px);transform:perspective(400px) rotateX(60deg);transform-origin:bottom;opacity:.4;animation:gridMove 3s linear infinite;}
@keyframes gridMove{0%{background-position:0 0,0 0,0 0;}100%{background-position:0 0,0 0,0 80px;}}
.orb{position:fixed;border-radius:50%;filter:blur(80px);z-index:-1;opacity:.45;pointer-events:none;}
.orb-1{width:360px;height:360px;background:var(--pink);top:-80px;right:-80px;animation:float1 12s ease-in-out infinite;}
.orb-2{width:320px;height:320px;background:var(--cyan);bottom:0;left:-90px;animation:float2 15s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-30px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-30px,40px);}}

/* TOPBAR */
.topbar{padding:18px 30px;border-bottom:2px solid var(--pink);display:flex;align-items:center;gap:24px;background:rgba(13,2,33,.85);backdrop-filter:blur(8px);box-shadow:0 0 12px rgba(255,46,136,.4);position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.topbar a{color:var(--text-secondary);font-size:14px;transition:var(--transition);position:relative;padding:4px 0;}
.topbar a:hover{color:var(--cyan);}
.topbar a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--cyan);transition:width .2s steps(4);}
.topbar a:hover::after{width:100%;}
.topbar .site-name{font-family:'Press Start 2P',monospace;color:var(--green);font-size:14px;letter-spacing:1px;text-shadow:var(--glow-green);margin-right:auto;}
.topbar .site-name:hover{color:var(--green);}
.topbar .site-name::after{display:none;}
.topbar .site-name::before{content:'▮ ';}
.topbar .current{color:var(--pink);font-weight:700;text-shadow:0 0 6px rgba(255,46,136,.5);}
.topbar .current::after{width:100%;background:var(--pink);}

/* CONTENT */
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;position:relative;}
.section-icon{font-size:56px;margin-bottom:24px;filter:drop-shadow(0 0 12px rgba(255,46,136,.6));animation:float1 4s ease-in-out infinite;}
.section-title{font-family:'Press Start 2P',monospace;font-size:clamp(28px,5vw,44px);color:var(--green);text-shadow:var(--glow-green),4px 4px 0 var(--pink);margin-bottom:14px;letter-spacing:2px;}
.section-subtitle{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--cyan);margin-bottom:44px;letter-spacing:3px;text-shadow:0 0 8px rgba(0,240,255,.5);}
.section-subtitle::before{content:'> ';color:var(--yellow);}
.empty-state{width:100%;max-width:520px;border:2px solid var(--cyan);border-radius:var(--radius);padding:56px 40px;background:var(--surface);box-shadow:var(--shadow-hard),0 0 20px rgba(0,240,255,.2);position:relative;overflow:hidden;}
.empty-state::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:repeating-linear-gradient(90deg,var(--pink) 0,var(--pink) 12px,transparent 12px,transparent 24px);}
.empty-state p{font-size:16px;color:var(--text-secondary);line-height:2;}
.empty-state p+p{margin-top:6px;}
.empty-state .hint{color:var(--green);font-family:'Press Start 2P',monospace;font-size:11px;margin-top:22px;letter-spacing:2px;text-shadow:0 0 8px rgba(0,255,65,.5);}
.empty-state .hint::before{content:'> ';animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:.3;}}

/* FOOTER */
.footer{padding:30px 20px;text-align:center;font-size:13px;border-top:2px solid var(--pink);position:relative;}
.footer::before{content:'';position:absolute;top:-2px;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--pink) 0,var(--pink) 20px,transparent 20px,transparent 40px);animation:footerScroll 2s linear infinite;}
@keyframes footerScroll{0%{background-position:0 0;}100%{background-position:40px 0;}}
.footer p{color:var(--text-secondary);font-family:'VT323',monospace;font-size:17px;letter-spacing:2px;}
.footer a{color:var(--green);}
.footer a:hover{text-shadow:var(--glow-green);}
.footer .sep{color:var(--text-secondary);margin:0 8px;}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="synth-grid"></div>

<div class="topbar">
    <a href="index.html" class="site-name">Portfolio</a>
    <a href="experience.html" class="current">游戏经历</a>
    <a href="deconstruct.html">游戏拆解</a>
    <a href="design.html">游戏策划</a>
</div>

<div class="content">
    <div class="section-icon">&#127918;</div>
    <h1 class="section-title">游戏经历</h1>
    <p class="section-subtitle">EXPERIENCE</p>

    <div class="empty-state">
        <p>这里将记录我的游戏旅程——从童年客厅里的红白机，到深夜屏幕前的通关时刻。</p>
        <p>每一款打动我的游戏，都值得被认真回忆。</p>
        <p class="hint">内容正在整理中，敬请期待。</p>
    </div>
</div>

<footer class="footer">
    <p><a href="index.html">像素与思考</a><span class="sep">·</span>游戏随笔</p>
</footer>

</body>
</html>
