<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《怪物猎人》Boss设计学习曲线 — Game Designer Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
    --bg:#0d0221;--bg-2:#1a0533;--surface:#170a3a;--surface-2:#1f0f4a;--border:#3d1d6e;
    --text:#f0eaff;--text-secondary:#9d8ec7;
    --green:#00ff41;--pink:#ff2e88;--cyan:#00f0ff;--yellow:#ffd23f;--accent:#00f0ff;
    --radius:4px;--shadow-hard:4px 4px 0 #000;
    --glow-green:0 0 8px rgba(0,255,65,.6),0 0 16px rgba(0,255,65,.3);
    --glow-pink:0 0 8px rgba(255,46,136,.6),0 0 16px rgba(255,46,136,.3);
    --transition:.2s steps(4);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans SC','VT323',monospace;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.7;position:relative;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;}
.container{width:min(1200px,92%);margin:auto;}
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply;}
body::after{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%);}
.synth-grid{position:fixed;left:0;right:0;bottom:0;height:55vh;z-index:-2;background:linear-gradient(to bottom,transparent 0%,#0d0221 80%),repeating-linear-gradient(90deg,transparent 0,transparent 79px,var(--pink) 79px,var(--pink) 80px),repeating-linear-gradient(0deg,transparent 0,transparent 79px,var(--cyan) 79px,var(--cyan) 80px);transform:perspective(400px) rotateX(60deg);transform-origin:bottom;opacity:.4;animation:gridMove 3s linear infinite;}
@keyframes gridMove{0%{background-position:0 0,0 0,0 0;}100%{background-position:0 0,0 0,0 80px;}}
.orb{position:fixed;border-radius:50%;filter:blur(80px);z-index:-1;opacity:.45;pointer-events:none;}
.orb-1{width:380px;height:380px;background:var(--pink);top:-80px;right:-80px;animation:float1 12s ease-in-out infinite;}
.orb-2{width:340px;height:340px;background:var(--cyan);bottom:5%;left:-90px;animation:float2 15s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-30px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-30px,40px);}}
.header{position:fixed;top:0;left:0;width:100%;z-index:1000;background:rgba(13,2,33,.85);backdrop-filter:blur(8px);border-bottom:2px solid var(--pink);box-shadow:0 0 12px rgba(255,46,136,.4);}
.nav-container{height:72px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:12px;font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:1px;color:var(--green);text-shadow:var(--glow-green);}
.logo-dot{width:12px;height:12px;background:var(--pink);box-shadow:0 0 8px var(--pink);animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:.3;}}
.nav{display:flex;gap:28px;align-items:center;}
.nav a{color:var(--text-secondary);font-size:14px;font-weight:500;transition:var(--transition);position:relative;padding:4px 0;}
.nav a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--cyan);transition:width .2s steps(4);}
.nav a:hover{color:var(--cyan);}
.nav a:hover::after{width:100%;}
.mobile-toggle{display:none;background:none;border:2px solid var(--border);color:var(--green);font-size:20px;width:42px;height:42px;border-radius:var(--radius);}
.mobile-menu{display:none;position:fixed;top:72px;left:0;width:100%;background:var(--bg-2);border-bottom:2px solid var(--pink);z-index:999;}
.mobile-menu.active{display:block;}
.mobile-menu a{display:block;padding:16px 24px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:15px;}
.mobile-menu a:hover{color:var(--cyan);background:var(--surface);padding-left:32px;}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--cyan);font-size:15px;margin-top:104px;transition:var(--transition);font-family:'VT323',monospace;font-size:18px;letter-spacing:1px;}
.back-link:hover{transform:translateX(-4px);color:var(--green);text-shadow:var(--glow-green);}
.article-page{padding:20px 0 120px;}
.article-header{margin-bottom:44px;}
.article-tag{display:inline-block;padding:5px 12px;border-radius:var(--radius);background:rgba(255,210,63,.1);border:1px solid var(--yellow);color:var(--yellow);font-family:'VT323',monospace;font-size:16px;margin-bottom:18px;letter-spacing:1px;}
.article-title{font-size:clamp(28px,4vw,40px);margin-bottom:16px;line-height:1.3;font-weight:900;color:var(--green);text-shadow:var(--glow-green),3px 3px 0 var(--pink);}
.article-desc{color:var(--text-secondary);font-size:17px;border-left:3px solid var(--pink);padding-left:16px;}
.article-body{max-width:800px;}
.empty-box{border:2px solid var(--border);border-radius:var(--radius);padding:70px 40px;text-align:center;margin-top:40px;background:var(--surface);box-shadow:var(--shadow-hard);position:relative;overflow:hidden;}
.empty-box::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:repeating-linear-gradient(90deg,var(--cyan) 0,var(--cyan) 12px,transparent 12px,transparent 24px);}
.empty-box p{color:var(--text-secondary);font-size:16px;line-height:1.9;}
.empty-box .hint{color:var(--green);font-family:'Press Start 2P',monospace;font-size:12px;margin-top:24px;text-shadow:0 0 8px rgba(0,255,65,.5);letter-spacing:2px;}
.empty-box .hint::before{content:'> ';animation:blink 1s steps(2) infinite;}
footer{border-top:2px solid var(--pink);padding:40px 0;position:relative;}
footer::before{content:'';position:absolute;top:-2px;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--pink) 0,var(--pink) 20px,transparent 20px,transparent 40px);animation:footerScroll 2s linear infinite;}
@keyframes footerScroll{0%{background-position:0 0;}100%{background-position:40px 0;}}
.footer-content{text-align:center;}
.footer-content p{color:var(--text-secondary);font-family:'VT323',monospace;font-size:18px;letter-spacing:2px;}
.footer-content p::before{content:'© ';color:var(--green);}
@media(max-width:768px){.nav{display:none;}.mobile-toggle{display:flex;align-items:center;justify-content:center;}.article-title{font-size:26px;}.back-link{margin-top:96px;}.orb{display:none;}}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="synth-grid"></div>

<p>将从Boss行为模式学习、武器适配策略、渐进难度曲线等维度展开分析。</p>

</div>
</div>
</div>
</div>
<footer><div class="container footer-content"><p>2026 Game Designer Portfolio</p></div></footer>

<script>
const t=document.getElementById('mobileToggle'),m=document.getElementById('mobileMenu');
t.addEventListener('click',()=>{m.classList.toggle('active');const i=t.querySelector('i');i.classList.toggle('fa-bars');i.classList.toggle('fa-xmark');});
m.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{m.classList.remove('active');const i=t.querySelector('i');i.classList.add('fa-bars');i.classList.remove('fa-xmark');}));
</script>
</body>
</html>
