.article-page{padding:40px 0 120px;}
.article-header{margin-bottom:40px;}
.article-tag{display:inline-block;padding:6px 12px;border-radius:999px;background:#1b1b1b;color:var(--accent);font-size:12px;margin-bottom:16px;}
.article-title{font-size:36px;margin-bottom:16px;line-height:1.3;}
.article-desc{color:var(--text-secondary);font-size:16px;}
.article-body{max-width:800px;}
.empty-box{border:1px solid var(--border);border-radius:20px;padding:80px 40px;text-align:center;margin-top:40px;}
.empty-box p{color:var(--text-secondary);font-size:16px;line-height:1.8;}
.empty-box .hint{color:var(--accent);font-size:13px;margin-top:20px;}
footer{border-top:1px solid var(--border);padding:40px 0;}
.footer-content{text-align:center;}
.footer-content p{color:var(--text-secondary);font-size:14px;}
@media(max-width:768px){.nav{display:none;}.article-title{font-size:28px;}}
